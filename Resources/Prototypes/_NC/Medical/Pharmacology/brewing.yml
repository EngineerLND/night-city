# Raw material players can brew themselves. These reagents do nothing to a body: they are only the starting
# point of the pharmacology chain. A solution of broth goes into the extractor, which reads its purity and
# contamination from what is actually in the container.

- type: reagent
  id: NCPharmaPrecursorSubstrate
  name: reagent-name-nc-pharma-precursor-substrate
  group: Biological
  desc: reagent-desc-nc-pharma-precursor-substrate
  physicalDesc: reagent-physical-desc-viscous
  flavor: bitter
  color: "#6B5A2E"

- type: reagent
  id: NCPharmaPrecursorSolvent
  name: reagent-name-nc-pharma-precursor-solvent
  group: Biological
  desc: reagent-desc-nc-pharma-precursor-solvent
  physicalDesc: reagent-physical-desc-translucent
  flavor: bitter
  color: "#9FD3D0"

- type: reagent
  id: NCPharmaRawBroth
  name: reagent-name-nc-pharma-raw-broth
  group: Biological
  desc: reagent-desc-nc-pharma-raw-broth
  physicalDesc: reagent-physical-desc-opaque
  flavor: bitter
  color: "#7C9A3D"

- type: reagent
  id: NCPharmaSludge
  name: reagent-name-nc-pharma-sludge
  group: Biological
  desc: reagent-desc-nc-pharma-sludge
  physicalDesc: reagent-physical-desc-murky
  flavor: bitter
  color: "#3A2A1B"

# Mix two parts substrate and one part solvent and keep it warm: a clean broth.
- type: reaction
  id: NCPharmaBrewBroth
  minTemp: 330
  maxTemp: 380
  reactants:
    NCPharmaPrecursorSubstrate:
      amount: 2
    NCPharmaPrecursorSolvent:
      amount: 1
  products:
    NCPharmaRawBroth: 3

# Overheat it and the broth spoils into sludge, which later ends up as contamination in the extract.
- type: reaction
  id: NCPharmaBrewSpoil
  minTemp: 400
  reactants:
    NCPharmaRawBroth:
      amount: 1
  products:
    NCPharmaSludge: 1

- type: entity
  parent: Jug
  id: NCPharmaSubstrateJug
  suffix: precursor
  components:
  - type: Label
    localizedLabel: reagent-name-nc-pharma-precursor-substrate
  - type: Solution
    solution:
      reagents:
      - ReagentId: NCPharmaPrecursorSubstrate
        Quantity: 150

- type: entity
  parent: Jug
  id: NCPharmaSolventJug
  suffix: precursor
  components:
  - type: Label
    localizedLabel: reagent-name-nc-pharma-precursor-solvent
  - type: Solution
    solution:
      reagents:
      - ReagentId: NCPharmaPrecursorSolvent
        Quantity: 150
